name: Build and check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Core and rendering checks
        run: ./scripts/test.sh
      - name: Build native app
        run: ./scripts/build.sh
      - name: Check landing page
        run: python3 scripts/check-site.py
